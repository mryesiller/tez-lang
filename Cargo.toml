[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mryesiller/tez-lang"
rust-version = "1.99"
authors = ["Tez contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tez_diag = { path = "crates/tez_diag" }
tez_syntax = { path = "crates/tez_syntax" }
tez_types = { path = "crates/tez_types" }
tez_interp = { path = "crates/tez_interp" }
tez_fmt = { path = "crates/tez_fmt" }
tez_driver = { path = "crates/tez_driver" }
tez_verify = { path = "crates/tez_verify" }
wasm-bindgen = "=0.2.129"
num-bigint = "0.4"
num-traits = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

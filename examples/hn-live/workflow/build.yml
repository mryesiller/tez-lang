# Copy this file to .github/workflows/build.yml of the repository that holds this folder's files.
# Every 5 minutes: fetch the top stories, bake them into stories.tez, let Tez prove, test and compile the page, deploy it.
name: Rebuild and deploy
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Tez compiler and the Z3 prover
        run: |
          sudo apt-get update && sudo apt-get install -y z3
          npm install -g tez-lang
      - name: Fetch the stories, prove the page, compile it
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
